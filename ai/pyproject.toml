[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netra-ai"
version = "0.1.0"
description = "NETRA final anomaly detection service (vision-language model via Ollama)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "pillow>=10.3",
  "prometheus-client>=0.20",
]

[tool.setuptools]
packages = ["netra_ai"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "D"]
ignore = ["D100", "D104", "D203", "D213"]

[tool.pytest.ini_options]
testpaths = ["tests"]
