run:
  timeout: 5m
linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - bodyclose
    - gosec
    - revive
linters-settings:
  gosec:
    excludes: [G104, G304, G306] # unchecked close on writers we cannot handle, paths come from our own DB
  revive:
    rules:
      - name: exported
        disabled: true
issues:
  exclude-dirs: [ai]
